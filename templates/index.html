<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celsius → Fahrenheit ML</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <div class="badge">ML Temperature Converter</div>
    <h1>Celsius to Fahrenheit</h1>
    <p class="sub">Enter a Celsius temperature and get the model prediction.</p>

    <form id="converterForm">
      <label for="celsius">Temperature in Celsius (°C)</label>
      <div class="input-row">
        <input id="celsius" name="celsius" type="number" step="any" placeholder="e.g. 100" required>
        <button type="submit">Predict</button>
      </div>
    </form>

    <section id="result" class="result hidden">
      <span id="cValue"></span>
      <span class="arrow">→</span>
      <strong id="fValue"></strong>
    </section>

    <p id="error" class="error"></p>
    <p class="note">Model trained from the Celsius/Fahrenheit examples in the supplied notebook.</p>
  </main>

  <script>
    const form = document.getElementById('converterForm');
    const result = document.getElementById('result');
    const errorBox = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.textContent = '';
      result.classList.add('hidden');

      const celsius = document.getElementById('celsius').value;

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({celsius})
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Prediction failed.');

        document.getElementById('cValue').textContent = `${data.celsius} °C`;
        document.getElementById('fValue').textContent = `${data.fahrenheit} °F`;
        result.classList.remove('hidden');
      } catch (err) {
        errorBox.textContent = err.message;
      }
    });
  </script>
</body>
</html>
